<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1f3d"/><stop offset="1" stop-color="#110d17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#ff4f8b" stop-opacity=".38"/><stop offset="1" stop-color="#ff4f8b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4f8b"/><stop offset="1" stop-color="#a80f50"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7aa8"/><stop offset="1" stop-color="#e0266f"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9dbe"/><stop offset="1" stop-color="#ff3f82"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2d6"/><stop offset="1" stop-color="#ff6a9c"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ff0c0"/><stop offset="1" stop-color="#17b585"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="4"/>
  <!-- stem + leaf -->
  <path d="M512 640 C 514 720, 506 790, 486 860" fill="none" stroke="url(#leaf)" stroke-width="30" stroke-linecap="round"/>
  <path d="M506 770 C 452 704, 372 704, 330 736 C 382 792, 456 806, 506 770 Z" fill="url(#leaf)"/>
  <!-- bloom: nested rounded squares turning into a spiral -->
  <g transform="translate(512 430)" filter="url(#sh)" stroke="#5a0526" stroke-opacity=".35" stroke-width="7">
    <rect x="-240" y="-240" width="480" height="480" rx="150" fill="url(#p1)"/>
    <rect x="-186" y="-186" width="372" height="372" rx="118" fill="url(#p3)" transform="rotate(22.5)"/>
    <rect x="-140" y="-140" width="280" height="280" rx="88" fill="url(#p1)" transform="rotate(45)"/>
    <rect x="-100" y="-100" width="200" height="200" rx="62" fill="url(#p4)" transform="rotate(67.5)"/>
    <rect x="-64" y="-64" width="128" height="128" rx="40" fill="url(#p2)" transform="rotate(90)"/>
    <circle r="30" fill="#a40f4d" stroke="none"/>
  </g>
  <rect width="1024" height="1024" rx="228" fill="url(#sheen)"/>
</svg>
